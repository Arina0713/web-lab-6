<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторная работа №6</title>
</head>
<body>
    <div class="calc-container">
        <h1>Калькулятор услуг</h1>
        <!-- Поле для ввода количества -->
         <div class="form-group">
            <label for="quantity">Количество:</label>
            <input type="text" id="quantity" placeholder="Введите число">
            <div id="error-msg" class="error"></div>
        </div>
        <!-- Выбор типа услуги (Радиокнопки) -->
         <div class="form-group">
            <label>Выберите тип услуги:</label>
            <div id="radio-container" class="radio-group">
                <!-- Радиокнопки добавятся через JS -->
                </div>
            </div>
            <!-- Динамический контейнер для селекта или чекбоксов -->
             <div id="dynamic-options-container"></div>
             <div class="result-area">
                Итого: <span id="total-price">0</span> $
            </div>
        </div>
        <!-- Подключение JS -->
         <script src="js-calc.js"></script>
</body>
</html>
